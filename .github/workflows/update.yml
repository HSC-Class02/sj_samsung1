
name: Update Samsung DART Financial Data

on:
  schedule:
    # 매월 1일 한국 시간 오전 9시 15분 (UTC 00:15)
    - cron: "15 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dart-financial-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch Samsung financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Samsung DART financial data"
            git push
          fi
